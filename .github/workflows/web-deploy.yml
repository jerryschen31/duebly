name: Web Deploy Dev

on:
  push:
    branches:
      - build
      - master
  pull_request:
    branches:
      - build
      - master
  workflow_dispatch:

jobs:
  validate-deploy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: src/.nvmrc
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Validate deploy build
        run: npm run build

      - name: Install Playwright browser
        run: |
          npx playwright install-deps chromium
          npx playwright install chromium

      - name: Run web tests
        env:
          CI: true
          PLAYWRIGHT_HTML_OPEN: never
        run: npm run test:web

  deploy-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/build'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: src/.nvmrc
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Cloudflare secrets are present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo "Missing required secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || { echo "Missing required secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Deploy dev worker with static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:dev

  deploy-prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: master
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: src/.nvmrc
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Cloudflare secrets are present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo "Missing required secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || { echo "Missing required secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Deploy prod worker with static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DUEBLY_KINDE_CLIENT_ID: ${{ secrets.DUEBLY_KINDE_CLIENT_ID || vars.DUEBLY_KINDE_CLIENT_ID }}
          DUEBLY_KINDE_REDIRECT_URI: ${{ secrets.DUEBLY_KINDE_REDIRECT_URI || vars.DUEBLY_KINDE_REDIRECT_URI }}
          DUEBLY_KINDE_LOGOUT_URI: ${{ secrets.DUEBLY_KINDE_LOGOUT_URI || vars.DUEBLY_KINDE_LOGOUT_URI }}
        run: npm run deploy:prod
